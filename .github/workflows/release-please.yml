name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run release-please
        uses: google-github-actions/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json

      # If release-please created/updated a PR, check out its head, run Prettier and push any formatting changes
      - name: Checkout release PR head
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: actions/checkout@v6
        with:
          repository: ${{ fromJson(steps.release.outputs.pr).head.repo.full_name }}
          ref: ${{ fromJson(steps.release.outputs.pr).head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Run Prettier
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        run: pnpm exec prettier --write . || true

      - name: Commit & push formatting changes
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          PR_REPO: ${{ fromJson(steps.release.outputs.pr).head.repo.full_name }}
          PR_REF: ${{ fromJson(steps.release.outputs.pr).head.ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: apply Prettier formatting" || echo "No commit"
            git push "https://${GITHUB_TOKEN}@github.com/${PR_REPO}" HEAD:${PR_REF}
          else
            echo "No formatting changes"
          fi
