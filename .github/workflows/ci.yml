name: CI
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: ['main', 'staging']
  push:
    branches: ['main']

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Run prettier
        run: pnpm format:check
      - name: Check linter
        run: pnpm lint:check
      - name: Check TypeScript
        run: pnpm type:check
      - name: Build
        run: pnpm build

  jest:
    name: Jest (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration, accuracy, performance, endurance]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Jest suite
        run: pnpm test:${{ matrix.suite }}

  system-scripts:
    name: System Script (${{ matrix.script }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DISABLED_CUSTOM_ADAPTERS: binance
      DISABLED_CCXT_EXCHANGES: binance
    strategy:
      fail-fast: false
      matrix:
        script: [data-flow, docker, feeds, load, readiness, security, server, shutdown]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq bc
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run system script
        run: pnpm test:${{ matrix.script }}

  debug-scripts:
    name: Debug Script (${{ matrix.script }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DISABLED_CUSTOM_ADAPTERS: binance
      DISABLED_CCXT_EXCHANGES: binance
    strategy:
      fail-fast: false
      matrix:
        script:
          [
            cache,
            config,
            data-aggregation,
            errors,
            feeds,
            integration,
            performance,
            resilience,
            resilience-consistency,
            startup,
            websockets,
          ]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq bc
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run debug script
        run: pnpm debug:${{ matrix.script }}
